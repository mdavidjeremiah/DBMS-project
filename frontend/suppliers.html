<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - Hardware World</title>
  <link rel="stylesheet" href="./assets/css/tailwind.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  
  <div class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Suppliers Directory</h1>
        <p class="text-muted-foreground mt-1">Manage vendor relationships and contact details.</p>
      </div>
      <div id="add-dialog-container"></div>
    </div>
    
    <div id="notice-container"></div>

    <div class="card">
      <div id="table-container">
        <div class="animate-pulse h-64 bg-muted rounded w-full"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { initShell } from './assets/js/shell.js';
    import { getSuppliers } from './assets/js/queries.js';
    import { createSupplier } from './assets/js/actions.js';
    import { createDataTable, createFormDialog, createDataNotice } from './assets/js/components.js';

    const user = await requireAuth();
    if (!user) { throw new Error("Auth failed"); }
    initShell(user);

    // Initialize Add Dialog (if authorized)
    if (['Admin', 'Procurement Officer'].includes(user.role)) {
      const dialogHtml = createFormDialog({
        title: 'Add New Supplier',
        triggerHtml: `<button class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Add Supplier</button>`,
        actionFn: createSupplier,
        fieldsHtml: `
          <div class="grid gap-4 md:grid-cols-2 mb-4">
            <div>
              <label class="label">Supplier Name</label>
              <input type="text" name="suppliername" class="input" required placeholder="e.g. Roofings Ltd">
            </div>
            <div>
              <label class="label">Contact Email</label>
              <input type="email" name="contactemail" class="input" placeholder="contact@example.com">
            </div>
            <div>
              <label class="label">Phone Number</label>
              <input type="tel" name="phonenumber" class="input" placeholder="+256...">
            </div>
          </div>
          <label class="label">Physical Address</label>
          <textarea name="address" class="input h-24 py-2 resize-none" placeholder="Business address..."></textarea>
        `
      });
      document.getElementById('add-dialog-container').appendChild(dialogHtml);
      lucide.createIcons();
    }

    try {
      const suppliers = await getSuppliers();
      
      const columns = [
        { header: 'ID', accessorKey: 'supplierid' },
        { header: 'Supplier Name', accessorKey: 'suppliername' },
        { header: 'Email', accessorKey: 'contactemail' },
        { header: 'Phone', accessorKey: 'phonenumber' },
        { header: 'Address', accessorKey: 'address' }
      ];

      const tableContainer = document.getElementById('table-container');
      tableContainer.innerHTML = '';
      tableContainer.appendChild(createDataTable(suppliers, columns, 'suppliername'));

    } catch (e) {
      document.getElementById('table-container').innerHTML = '';
      const rlsBlocked = e.message.includes('RLS') || e.message.includes('permission');
      document.getElementById('notice-container').appendChild(createDataNotice(e.message, rlsBlocked));
    }
  </script>
</body>
</html>
