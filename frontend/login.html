<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware World - Sign In</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark bg-slate-950 text-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-5xl grid md:grid-cols-2 gap-8 md:gap-0 bg-slate-900/50 rounded-[2rem] border border-slate-800 shadow-2xl overflow-hidden">
    
    <!-- Branding / Info Side -->
    <div class="hidden md:flex flex-col justify-between p-12 bg-gradient-to-br from-slate-900 to-slate-950 border-r border-slate-800 relative overflow-hidden">
      <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
      
      <div class="relative z-10">
        <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-orange-600/20 text-orange-500 mb-6">
          <i data-lucide="hammer" class="w-6 h-6"></i>
        </div>
        <h1 class="text-4xl font-black tracking-tight text-white mb-4">Hardware World</h1>
        <p class="text-slate-400 leading-relaxed text-lg">
          Enterprise Operations Management System. Secure access to inventory, sales, and HR portals.
        </p>
      </div>

      <div class="relative z-10">
        <div class="flex items-center gap-3 text-sm text-slate-500 font-medium">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
          <span>ABAC & RBAC Enforced</span>
        </div>
        <div class="flex items-center gap-3 text-sm text-slate-500 font-medium mt-2">
          <i data-lucide="lock" class="w-4 h-4 text-orange-500"></i>
          <span>End-to-End Encrypted</span>
        </div>
      </div>
    </div>

    <!-- Login Form Side -->
    <div class="p-8 md:p-12 flex flex-col justify-center">
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-white mb-2">Welcome Back</h2>
        <p class="text-slate-400">Sign in to your staff portal account.</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="label text-slate-300">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-2.5 w-4 h-4 text-slate-500"></i>
            <input type="email" name="email" required placeholder="Enter your work email" class="input pl-10 bg-slate-950 border-slate-800 text-white placeholder:text-slate-600" />
          </div>
        </div>

        <div>
          <label class="label text-slate-300">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-2.5 w-4 h-4 text-slate-500"></i>
            <input type="password" name="password" id="password-input" required placeholder="••••••••" class="input pl-10 bg-slate-950 border-slate-800 text-white placeholder:text-slate-600" />
            <button type="button" id="toggle-password" class="absolute right-3 top-2.5 text-slate-500 hover:text-white">
              <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full py-2.5 text-base" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-slate-500">
        Need an account? <a href="/sign-up.html" class="text-orange-500 hover:text-orange-400 font-medium">Contact Administrator</a>
      </div>

      <!-- Demo Accounts (For easy testing) -->
      <div class="mt-8 pt-8 border-t border-slate-800">
        <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-3 text-center">Fast-Fill Demo Accounts</p>
        <div class="grid grid-cols-2 gap-2">
          <button class="demo-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded" data-email="akena@hw.local" data-pass="admin123">Admin</button>
          <button class="demo-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded" data-email="sarah@hw.local" data-pass="cashier123">Cashier</button>
          <button class="demo-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded" data-email="john@hw.local" data-pass="proc123">Procurement</button>
          <button class="demo-btn text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded" data-email="grace@hw.local" data-pass="hr123">HR</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { apiRequest, setAccessToken } from './assets/js/api.js';

    lucide.createIcons();

    // Toggle password visibility
    const pwdInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    
    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // Demo buttons
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelector('input[name="email"]').value = e.target.dataset.email;
        pwdInput.value = e.target.dataset.pass;
      });
    });

    // Form submission
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = form.email.value;
      const password = form.password.value;
      
      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Signing in...';
        lucide.createIcons();

        // OAuth2 Password Request
        const formData = new URLSearchParams();
        formData.append('username', email); // FastAPI OAuth2 uses 'username' field
        formData.append('password', password);

        const data = await apiRequest('/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        // Save token and redirect
        setAccessToken(data.access_token);
        window.location.href = '/index.html';
        
      } catch (error) {
        alert(`Login failed: ${error.message}`);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
