<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Hardware World</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  
  <div class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Products Inventory</h1>
        <p class="text-muted-foreground mt-1">Manage all products and pricing.</p>
      </div>
      <div id="add-dialog-container"></div>
    </div>
    
    <div id="notice-container"></div>

    <div class="card">
      <div id="table-container">
        <div class="animate-pulse h-64 bg-muted rounded w-full"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { initShell } from './assets/js/shell.js';
    import { getProducts, getCategories } from './assets/js/queries.js';
    import { createProduct } from './assets/js/actions.js';
    import { createDataTable, createFormDialog, createDataNotice, formatMoney } from './assets/js/components.js';

    const user = await requireAuth();
    if (!user) { throw new Error("Auth failed"); }
    initShell(user);

    try {
      const [products, categories] = await Promise.all([
        getProducts(),
        getCategories()
      ]);
      
      // Initialize Add Dialog (if authorized)
      if (['Admin', 'Procurement Officer'].includes(user.role)) {
        const catOptions = (categories || []).map(c => `<option value="${c.categoryid}">${c.categoryname}</option>`).join('');
        
        const dialogHtml = createFormDialog({
          title: 'Add New Product',
          triggerHtml: `<button class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Add Product</button>`,
          actionFn: createProduct,
          fieldsHtml: `
            <div class="grid gap-4 md:grid-cols-2 mb-4">
              <div>
                <label class="label">Product Name</label>
                <input type="text" name="itemname" class="input" required placeholder="e.g. Claw Hammer">
              </div>
              <div>
                <label class="label">Category</label>
                <select name="categoryid" class="input" required>
                  <option value="">Select category...</option>
                  ${catOptions}
                </select>
              </div>
              <div>
                <label class="label">Unit Price (UGX)</label>
                <input type="number" name="unitprice" class="input" required min="0" placeholder="e.g. 25000">
              </div>
            </div>
            <label class="label">Description</label>
            <textarea name="description" class="input h-24 py-2 resize-none" placeholder="Product details..."></textarea>
          `
        });
        document.getElementById('add-dialog-container').appendChild(dialogHtml);
        lucide.createIcons();
      }

      const columns = [
        { header: 'ID', accessorKey: 'itemid' },
        { header: 'Product Name', accessorKey: 'itemname' },
        { 
          header: 'Category', 
          cell: (row) => row.category ? row.category.categoryname : 'Uncategorized' 
        },
        { 
          header: 'Unit Price', 
          cell: (row) => formatMoney(row.unitprice)
        },
        { header: 'Description', accessorKey: 'description' }
      ];

      const tableContainer = document.getElementById('table-container');
      tableContainer.innerHTML = '';
      tableContainer.appendChild(createDataTable(products, columns, 'itemname'));

    } catch (e) {
      document.getElementById('table-container').innerHTML = '';
      const rlsBlocked = e.message.includes('RLS') || e.message.includes('permission');
      document.getElementById('notice-container').appendChild(createDataNotice(e.message, rlsBlocked));
    }
  </script>
</body>
</html>
