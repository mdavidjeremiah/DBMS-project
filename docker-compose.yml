services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hardware_world}
      MYSQL_USER: ${MYSQL_USER:-hw_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hw_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hw_root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hardware_world}
      DB_USER: ${MYSQL_USER:-hw_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hw_password}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-hw_user}:${MYSQL_PASSWORD:-hw_password}@db:3306/${MYSQL_DATABASE:-hardware_world}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
    volumes:
      # Mount backend for live reload during development
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
